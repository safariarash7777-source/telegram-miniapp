name: CI

# This repository had **no** workflow at all, so every PR merged with zero
# automated verification — including the lead-webhook change, whose whole point
# is that silent failures are dangerous. Shipping that on "it typechecked on my
# machine" would have repeated the mistake it fixes.
#
# Deliberately minimal and secret-free: typecheck plus unit tests. It never
# connects to MySQL, Telegram or the Portfolio platform, and needs no secrets,
# so it is safe to run on any PR.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Typecheck · Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `cache: npm` on purpose — that option needs a lockfile to hash, and
      # this repository has **none committed**. Enabling it fails the job before
      # a single test runs, which is exactly what happened on the first attempt.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Two reasons `npm ci` is not used here, both worth stating plainly:
      #   1. there is no committed lockfile, so `npm ci` cannot run at all;
      #   2. the dependency graph needs --legacy-peer-deps (recharts/react).
      #
      # That means installs in this repository are **not reproducible** — a
      # genuine hygiene gap, recorded rather than silently papered over.
      # Committing a lockfile is a separate change with its own review; doing it
      # inside a lead-webhook PR would bury it.
      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck
        run: npm run check

      - name: Tests
        run: npm test

  # Single aggregate check, so branch protection only ever needs one context.
  ci:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [quality]
    if: always()
    steps:
      - name: Check job results
        run: |
          echo "quality: ${{ needs.quality.result }}"
          if [ "${{ needs.quality.result }}" != "success" ]; then
            echo "::error::CI failed."
            exit 1
          fi
          echo "All gates green."
