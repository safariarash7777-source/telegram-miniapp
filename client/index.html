<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0D1F4A" />
    <title>آرش صفری | مشاور سرمایه‌گذاری</title>

    <!-- Pelak Brand Font (self-hosted — files live in client/public/fonts,
         fetched once via scripts/fetch-brand-assets.sh) -->
    <style>
      @font-face {
        font-family: 'Pelak';
        src: url('/fonts/Pelak-Bold_c6d514e8.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      @font-face {
        font-family: 'Pelak';
        src: url('/fonts/Pelak-ExtraBold_d276833a.woff2') format('woff2');
        font-weight: 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'Pelak';
        src: url('/fonts/Pelak-Black_09ef6ce9.woff2') format('woff2');
        font-weight: 900;
        font-display: swap;
      }
      html { direction: rtl; background: #0D1F4A; }
      body { margin: 0; font-family: 'Pelak', 'Vazirmatn', 'Tahoma', sans-serif; }
    </style>

    <!-- Vazirmatn is self-hosted (bundled from the npm package via index.css).
         Inter / Cormorant Garamond fall back to system fonts to avoid a
         runtime Google Fonts dependency (slow/unreliable on Iranian networks). -->

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>
</html>
